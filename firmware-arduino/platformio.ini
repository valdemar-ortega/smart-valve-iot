; Arduino prototype of the pressure node (the version that ran in the field).
; Build:   pio run
; Flash:   pio run -t upload
; Monitor: pio device monitor

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600
; PlatformIO finds the serial port on its own. If you have several boards
; plugged in, set it here, e.g.  upload_port = /dev/ttyACM0  or  COM5

lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    knolleary/PubSubClient@^2.8

build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D MQTT_MAX_PACKET_SIZE=512
