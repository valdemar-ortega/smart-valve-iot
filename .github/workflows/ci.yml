name: CI

on:
  push:
  pull_request:

jobs:
  firmware:
    name: Firmware (ESP-IDF build + host tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host unit tests (ASan + UBSan)
        run: make -C firmware/test SANITIZE=1
      - name: Build for ESP32-S3
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.2
          target: esp32s3
          path: firmware

  firmware-arduino:
    name: Firmware, Arduino prototype (PlatformIO build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware-arduino
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      - run: cp include/secrets.example.h include/secrets.h
      - run: pio run

  android:
    name: Android (unit tests + debug APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testDebugUnitTest assembleDebug

  backend:
    name: Backend (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
